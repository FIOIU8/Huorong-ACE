name: Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: draft-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: windows-2022
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Locate Visual Studio Appx tools
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found: $vswhere"
          }

          $vsRoot = & $vswhere -latest -prerelease -products * -requires Microsoft.Component.MSBuild -property installationPath |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($vsRoot)) {
            throw 'A Visual Studio installation with MSBuild was not found on the runner.'
          }

          $appxPath = Join-Path $vsRoot 'MSBuild\Microsoft\VisualStudio\v17.0\AppxPackage'
          $priTask = Join-Path $appxPath 'Microsoft.Build.Packaging.Pri.Tasks.dll'
          if (-not (Test-Path $priTask)) {
            $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            if (-not (Test-Path $installer)) {
              throw "Visual Studio Installer was not found: $installer"
            }

            Write-Host "Installing the Visual Studio UWP/Appx support component for $vsRoot"
            & $installer modify --installPath $vsRoot --add Microsoft.VisualStudio.Component.UWP.Support --quiet --norestart
            if ($LASTEXITCODE -ne 0) {
              throw "Visual Studio UWP/Appx component installation failed with exit code $LASTEXITCODE."
            }
          }

          if (-not (Test-Path $priTask)) {
            throw "Visual Studio Appx/PRI task assembly was not found: $priTask"
          }

          "VS_BUILDTOOLS_PATH=$vsRoot" >> $env:GITHUB_ENV

      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Version '$env:RELEASE_VERSION' must match vMAJOR.MINOR.PATCH, for example v1.0.0."
          }

          gh release view $env:RELEASE_VERSION --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "A release named '$env:RELEASE_VERSION' already exists."
          }

      - name: Build Windows folder deployment
        shell: cmd
        env:
          CI: '1'
        run: call build.bat Release folder

      - name: Create ZIP package
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'dist\HuorongAce-folder'
          if (-not (Test-Path $source)) {
            throw "Build output was not found: $source"
          }

          $package = Join-Path $env:GITHUB_WORKSPACE "HuorongAce-$env:RELEASE_VERSION-win-x64.zip"
          if (Test-Path $package) {
            Remove-Item -LiteralPath $package -Force
          }

          Compress-Archive -Path (Join-Path $source '*') -DestinationPath $package -CompressionLevel Optimal
          "RELEASE_PACKAGE=$package" >> $env:GITHUB_ENV

      - name: Create draft GitHub release
        shell: pwsh
        run: |
          gh release create $env:RELEASE_VERSION $env:RELEASE_PACKAGE `
            --repo $env:GITHUB_REPOSITORY `
            --target '${{ github.sha }}' `
            --draft `
            --generate-notes `
            --title $env:RELEASE_VERSION
