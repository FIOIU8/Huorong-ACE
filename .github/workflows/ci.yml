name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Locate Visual Studio Appx tools
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found: $vswhere"
          }

          $vsRoot = & $vswhere -latest -prerelease -products * -requires Microsoft.Component.MSBuild -property installationPath |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($vsRoot)) {
            throw 'A Visual Studio installation with MSBuild was not found on the runner.'
          }

          $appxPath = Join-Path $vsRoot 'MSBuild\Microsoft\VisualStudio\v17.0\AppxPackage'
          $priTask = Join-Path $appxPath 'Microsoft.Build.Packaging.Pri.Tasks.dll'
          if (-not (Test-Path $priTask)) {
            $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            if (-not (Test-Path $installer)) {
              throw "Visual Studio Installer was not found: $installer"
            }

            Write-Host "Installing the Visual Studio UWP/Appx support component for $vsRoot"
            & $installer modify --installPath $vsRoot --add Microsoft.VisualStudio.Component.UWP.Support --quiet --norestart
            if ($LASTEXITCODE -ne 0) {
              throw "Visual Studio UWP/Appx component installation failed with exit code $LASTEXITCODE."
            }
          }

          if (-not (Test-Path $priTask)) {
            throw "Visual Studio Appx/PRI task assembly was not found: $priTask"
          }

          "VS_BUILDTOOLS_PATH=$vsRoot" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore HuorongAce.sln

      - name: Build
        run: dotnet build HuorongAce.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HuorongAce.sln --configuration Release --no-build --no-restore
